            from checkpy import *
            import sys
            import io

            ######## Generic helpers for class tests ########
            def get_class(class_name):
                """
                Helper to retrieve the underlying Python class from the checkpy wrapper.
                """
                class_wrapper = getModule().__dict__.get(class_name)
                assert class_wrapper is not None, f"No {class_name} class found."
                return class_wrapper._function


            def assert_attr_equal(obj, attr, expected, context=""):
                """
                Helper to assert that an object has a given attribute with the expected value.
                """
                assert hasattr(obj, attr), f"{context}: Missing attribute '{attr}'."
                value = getattr(obj, attr)
                assert value == expected, f"{context}: {attr} has value {value!r}, expected {expected!r}."


            def assert_has_method(Class, method_name, context=""):
                """
                Helper to assert that a class has a callable method with the given name.
                """
                assert hasattr(Class, method_name), \
                    f"{context}{Class.__name__} is missing the method '{method_name}'."
                attr = getattr(Class, method_name)
                assert callable(attr), \
                    f"{context}{Class.__name__}.{method_name} exists but is not a method."
                return attr


            def class_init_test_factory(class_name, init_kwargs, required_attrs):
                """
                Factory to create a @test that:
                - verifies the class exists,
                - __init__ exists,
                - an instance can be initialized,
                - required attributes are present and correctly initialized.
                """

                def inner():
                    Class = get_class(class_name)

                    # Check __init__ presence
                    assert "__init__" in Class.__dict__, \
                        f"The {class_name} class does not contain an __init__ method."

                    # Initialize instance
                    instance = Class(**init_kwargs)

                    # Check required attributes
                    for attr_name, expected_value in required_attrs.items():
                        assert hasattr(instance, attr_name), \
                            f"The {class_name} class does not store a '{attr_name}' attribute after initialization."

                        value = getattr(instance, attr_name)
                        assert type(value) is type(expected_value), \
                            f"The '{attr_name}' attribute in {class_name} has type {type(value).__name__}, " \
                            f"expected {type(expected_value).__name__}."
                        assert value == expected_value, \
                            f"The '{attr_name}' attribute in {class_name} does not have the correct initial value."

                inner.__name__ = f"{class_name.lower()}_init_attributes"
                inner.__doc__ = f"{class_name} class initializes an instance correctly with __init__ and required attributes"

                return test()(inner)


            def method_existence_test_factory(class_name, methods, dependency_test):
                """
                Factory to create a @passed test that checks, for each method, that:
                - it exists on the class
                - it is callable
                """

                def inner():
                    Class = get_class(class_name)

                    for method in methods:
                        # Use the shared helper so messages are consistent and logic is centralized
                        assert_has_method(Class, method)

                inner.__name__ = f"{class_name.lower()}_methods"
                inner.__doc__ = f"{class_name} methods exist and are callable"

                return passed(dependency_test, hide=False)(inner)


            ######## Company tests ########

            company_init_attributes = class_init_test_factory(
                "Company",
                init_kwargs={"balance": 1000000},
                required_attrs={"balance": 1000000, "employees": []},
            )

            company_methods = method_existence_test_factory(
                "Company",
                methods=["add_employee", "find_employee", "payout_salary", "print_employees_with_title"],
                dependency_test=company_init_attributes,
            )

            @test()
            def test_add_employee_method():
                """Company add_employee method adds Employee instances to employees list"""

                # if method is missing, print it cannot be tested
                try:
                    assert_has_method(get_class("Company"), "add_employee")
                except AssertionError:
                    assert False, "This method is not implemented yet. Complete it to pass this test."

                Company = get_class("Company")
                company = Company(balance=1000000)

                company.add_employee("John Doe", 50000, "Developer")

                assert isinstance(company.employees, list), \
                    "The 'employees' attribute should be a list."
                assert len(company.employees) == 1, \
                    "The add_employee method should add exactly one employee to the employees list."

                employee = company.employees[0]
                assert_attr_equal(employee, "name", "John Doe", context="Employee")
                assert_attr_equal(employee, "salary", 50000, context="Employee")
                assert_attr_equal(employee, "function_title", "Developer", context="Employee")


            @passed(test_add_employee_method, hide=False)
            def test_find_employee_method():
                """Company find_employee returns the correct Employee instance when found"""

                # if method is missing, print it cannot be tested
                try:
                    assert_has_method(get_class("Company"), "find_employee")
                except AssertionError:
                    assert False, "This method is not implemented yet. Complete it to pass this test."

                Company = get_class("Company")
                company = Company(balance=1000000)

                company.add_employee("John Doe", 50000, "Developer")
                company.add_employee("Jane Smith", 60000, "Manager")

                employee = company.find_employee("Jane Smith")

                assert employee is not None, \
                    "find_employee returned None for an existing employee name."
                assert_attr_equal(employee, "name", "Jane Smith", context="find_employee()")
                assert_attr_equal(employee, "salary", 60000, context="find_employee()")
                assert_attr_equal(employee, "function_title", "Manager", context="find_employee()")


            @passed(test_add_employee_method, hide=False)
            def test_find_employee_not_found():
                """Company find_employee returns None when the employee does not exist"""

                # if method is missing, print it cannot be tested
                try:
                    assert_has_method(get_class("Company"), "find_employee")
                except AssertionError:
                    assert False, "This method is not implemented yet. Complete it to pass this test."

                Company = get_class("Company")
                company = Company(balance=1000000)

                company.add_employee("John Doe", 50000, "Developer")
                company.add_employee("Jane Smith", 60000, "Manager")

                employee = company.find_employee("Alice Johnson")  # not in the list

                assert employee is None, \
                    "Expected find_employee to return None for a name that does not exist."


            @passed(test_add_employee_method, hide=False)
            def test_payout_salary_method():
                """Company payout_salary correctly deducts total salary from balance"""

                # if method is missing, print it cannot be tested
                try:
                    assert_has_method(get_class("Company"), "payout_salary")
                except AssertionError:
                    assert False, "This method is not implemented yet. Complete it to pass this test."

                Company = get_class("Company")
                company = Company(balance=1000000)

                company.add_employee("John Doe", 50000, "Developer")
                company.add_employee("Jane Smith", 60000, "Manager")

                initial_balance = company.balance
                company.payout_salary()

                expected_balance = initial_balance - (50000 + 60000)
                assert company.balance == expected_balance, (
                    f"payout_salary did not deduct the correct total salary from the balance. "
                    f"Expected {expected_balance}, got {company.balance}."
                )
                # We intentionally do NOT check printed output; only the numerical effect matters here.


            @passed(test_add_employee_method, hide=False)
            def test_payout_salary_no_employees():
                """Company payout_salary leaves balance unchanged when there are no employees"""

                # if method is missing, print it cannot be tested
                try:
