            from checkpy import *
            import copy

            venue_seats = {
                'Tivoli': [
                    ('VIP', 'A1'), ('VIP', 'A2'),
                    ('General', 'B1'), ('General', 'B2'),
                    ('General', 'B3'), ('General', 'B4')
                ],
                'Ahoy': [
                    ('VIP', 'A1'), ('VIP', 'A2'), ('VIP', 'A3'),
                    ('General', 'B1'), ('General', 'B2'),
                    ('General', 'C1'), ('General', 'C2'),
                    ('General', 'D1'), ('General', 'D2')
                ],
                'Ziggo Dome': [
                    ('General', 'A1'), ('General', 'B1'),
                    ('General', 'C1'), ('General', 'D1')
                ]
            }

            concerts = [
                ('Backstreet Boys', 'Ahoy', '11-02-2024'),
                ('Backstreet Boys', 'Tivoli', '12-02-2024'),
                ('Backstreet Boys', 'Ziggo Dome', '13-02-2024'),
                ('Golden Earring', 'Ahoy', '18-02-2024'),
                ('Greenday', 'Ziggo Dome', '18-02-2024')
            ]

            # Expected result of initialize_concert_database(concerts)
            initial_concert_database = {
                ('Ahoy', 'Backstreet Boys', '11-02-2024'): [],
                ('Tivoli', 'Backstreet Boys', '12-02-2024'): [],
                ('Ziggo Dome', 'Backstreet Boys', '13-02-2024'): [],
                ('Ahoy', 'Golden Earring', '18-02-2024'): [],
                ('Ziggo Dome', 'Greenday', '18-02-2024'): []
            }

            # Expected fully populated database after populate_concert_database
            expected_populated_database = {
                ('Ahoy', 'Backstreet Boys', '11-02-2024'): [
                    (None, 'VIP', 'A1'), (None, 'VIP', 'A2'), (None, 'VIP', 'A3'),
                    (None, 'General', 'B1'), (None, 'General', 'B2'),
                    (None, 'General', 'C1'), (None, 'General', 'C2'),
                    (None, 'General', 'D1'), (None, 'General', 'D2')
                ],
                ('Tivoli', 'Backstreet Boys', '12-02-2024'): [
                    (None, 'VIP', 'A1'), (None, 'VIP', 'A2'),
                    (None, 'General', 'B1'), (None, 'General', 'B2'),
                    (None, 'General', 'B3'), (None, 'General', 'B4')
                ],
                ('Ziggo Dome', 'Backstreet Boys', '13-02-2024'): [
                    (None, 'General', 'A1'), (None, 'General', 'B1'),
                    (None, 'General', 'C1'), (None, 'General', 'D1')
                ],
                ('Ahoy', 'Golden Earring', '18-02-2024'): [
                    (None, 'VIP', 'A1'), (None, 'VIP', 'A2'), (None, 'VIP', 'A3'),
                    (None, 'General', 'B1'), (None, 'General', 'B2'),
                    (None, 'General', 'C1'), (None, 'General', 'C2'),
                    (None, 'General', 'D1'), (None, 'General', 'D2')
                ],
                ('Ziggo Dome', 'Greenday', '18-02-2024'): [
                    (None, 'General', 'A1'), (None, 'General', 'B1'),
                    (None, 'General', 'C1'), (None, 'General', 'D1')
                ]
            }

            def normalize_tickets(tickets):
                """
                Sort ticket tuples so that list order does not matter in comparisons.
                """
                return sorted(tickets)


            ######## Q1 ########

            fun1_def_bi = (
                declarative
                .function("initialize_concert_database")
                .params("concerts")
                .returnType(dict)
                .description("initialize_concert_database() is correctly defined")
            )

            test_1_bi = test()(fun1_def_bi)


            @passed(test_1_bi, hide=False)
            def test_initialize_concert_database():
                """initialize_concert_database creates the correct keys with empty ticket lists"""

                f = getFunction("initialize_concert_database")
                db = f(concerts)

                assert isinstance(db, dict), \
                    f"Expected initialize_concert_database to return a dict, got {type(db)}."

                # Keys must match expected keys (order of dict keys does not matter)
                assert set(db.keys()) == set(initial_concert_database.keys()), (
                    "initialize_concert_database did not create the correct set of concerts.\n"
                    f"Expected concerts: {set(initial_concert_database.keys())}\n"
                    f"Got:               {set(db.keys())}"
                )

                # All values should be empty lists
                for concert in initial_concert_database.keys():
                    assert concert in db, f"Concert {concert!r} is missing from the database."
                    assert isinstance(db[concert], list), \
                        f"The value for concert {concert!r} should be a list."
                    assert db[concert] == [], \
                        f"The ticket list for concert {concert!r} should be empty after initialization."


            ######## Q2 ########

            fun2_def_bi = (
                declarative
                .function("populate_concert_database")
                .params("concert_database", "venue_seats")
                .returnType(dict)
                .description("populate_concert_database() is correctly defined")
            )

            test_2_bi = passed(test_1_bi, hide=False)(fun2_def_bi)


            @passed(test_2_bi, hide=False)
            def test_populate_concert_database():
                """populate_concert_database fills the database with the correct tickets (order does not matter)"""

                f_init = getFunction("initialize_concert_database")
                f_populate = getFunction("populate_concert_database")

                # Start from a fresh initialized database
                db = f_init(concerts)
                db = f_populate(db, venue_seats)

                assert isinstance(db, dict), \
                    f"Expected populate_concert_database to return a dict, got {type(db)}."

                assert set(db.keys()) == set(expected_populated_database.keys()), (
                    "populate_concert_database did not produce the correct set of concerts.\n"
                    f"Expected concerts: {set(expected_populated_database.keys())}\n"
                    f"Got:               {set(db.keys())}"
                )

                # Compare tickets per concert, ignoring order
                for concert, expected_tickets in expected_populated_database.items():
                    assert concert in db, f"Concert {concert!r} is missing from the database."
                    actual_tickets = db[concert]
                    assert isinstance(actual_tickets, list), \
                        f"The value for concert {concert!r} should be a list of tickets."

                    assert normalize_tickets(actual_tickets) == normalize_tickets(expected_tickets), (
                        f"Tickets for concert {concert!r} are incorrect.\n"
                        f"Expected (order-free): {normalize_tickets(expected_tickets)}\n"
                        f"Got:                   {normalize_tickets(actual_tickets)}"
                    )


            ######## Q3 ########

            fun3_def_bi = (
                declarative
                .function("sell_ticket")
                .params("concert_database", "concert", "seat_number", "name")
                .returnType(None)
                .description("sell_ticket() is correctly defined")
            )

            test_3_def_bi = passed(test_2_bi, hide=False)(fun3_def_bi)


            @passed(test_3_def_bi, hide=False)
            def test_sell_ticket():
                """sell_ticket sets the buyer's name for the given seat,
                and leaves other tickets for that concert with name None."""

                f_init = getFunction("initialize_concert_database")
                f_populate = getFunction("populate_concert_database")
                f_sell = getFunction("sell_ticket")

                db = f_populate(f_init(concerts), venue_seats)

                concert = ('Ahoy', 'Backstreet Boys', '11-02-2024')

                # Sell two specific tickets
                result1 = f_sell(db, concert, 'A3', 'Jan Janssen')
                result2 = f_sell(db, concert, 'C1', 'Bart Bakker')

                # Require explicit None return (as per spec)
                assert result1 is None, \
                    f"Expected sell_ticket to return None, but got {type(result1)}."
                assert result2 is None, \
                    f"Expected sell_ticket to return None, but got {type(result2)}."

                # Inspect tickets for this concert
                assert concert in db, \
                    f"Concert {concert!r} is missing from the concert_database after selling tickets."

                tickets = db[concert]
                assert isinstance(tickets, list), \
                    f"The value for concert {concert!r} should be a list of tickets."

                # Build mapping (category, seat) -> name for assertions
                seat_map = {}
                for name, category, seat in tickets:
                    seat_map[(category, seat)] = name

                # Correct seats sold to correct buyers
                assert seat_map.get(('VIP', 'A3')) == 'Jan Janssen', \
                    "Seat 'A3' (VIP) should be sold to 'Jan Janssen'."
                assert seat_map.get(('General', 'C1')) == 'Bart Bakker', \
                    "Seat 'C1' (General) should be sold to 'Bart Bakker'."

                # Other seats for this concert should remain unsold (name is None)
                for category, seat in venue_seats['Ahoy']:
                    if (category, seat) in [('VIP', 'A3'), ('General', 'C1')]:
                        continue
                    assert seat_map.get((category, seat)) is None, \
                        f"Seat '{seat}' in category '{category}' should still be available (name should be None)."


            ######## Q4 ########

            fun4_def_bi = (
                declarative
                .function("get_available_tickets")
                .params("concert_database", "concert")
                .returnType(list)
                .description("get_available_tickets() is correctly defined")
            )

            test_4_def_bi = passed(test_2_bi, hide=False)(fun4_def_bi)

            concert_for_q4 = ('Ahoy', 'Backstreet Boys', '11-02-2024')
            expected_available_tickets = [
                (None, 'VIP', 'A1'), (None, 'VIP', 'A2'),
                (None, 'General', 'B1'), (None, 'General', 'B2'),
                (None, 'General', 'C2'),
                (None, 'General', 'D1'), (None, 'General', 'D2')
            ]


            @passed(test_4_def_bi, hide=False)
            def test_get_available_tickets():
                """get_available_tickets returns exactly the unsold tickets for a concert,
                order does not matter, and does not modify the concert_database."""

                f_init = getFunction("initialize_concert_database")
                f_populate = getFunction("populate_concert_database")
                f_sell = getFunction("sell_ticket")
                f_available = getFunction("get_available_tickets")

                # Build populated database and sell two tickets (same as in test_sell_ticket)
                db = f_populate(f_init(concerts), venue_seats)
                f_sell(db, concert_for_q4, 'A3', 'Jan Janssen')
                f_sell(db, concert_for_q4, 'C1', 'Bart Bakker')

                # Keep a deep copy to check that get_available_tickets does not mutate db
                db_before = copy.deepcopy(db)

                available = f_available(db, concert_for_q4)

                assert isinstance(available, list), \
                    f"Expected get_available_tickets to return a list, got {type(available)}."

                # Compare tickets ignoring order
                assert normalize_tickets(available) == normalize_tickets(expected_available_tickets), (
                    "get_available_tickets did not return the correct available tickets.\n"
                    f"Expected (order-free): {normalize_tickets(expected_available_tickets)}\n"
                    f"Got:                   {normalize_tickets(available)}"
                )

                # Database should not be modified by get_available_tickets
                assert db == db_before, \
