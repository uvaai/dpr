templates:
    2: &auto-manual
        type: float
        subgrades:
            correctness: integer
            points: integer
        automatic:
            correctness: (correctness_score * 100).floor
        calculation: (correctness/100).floor * points
    3: &manual
        type: float
        subgrades:
            points: float
        calculation: points
    4: &fullyauto
        type: pass
        subgrades:
            correctness: integer
        automatic:
            correctness: (correctness_score * 100).floor
        calculation: -(correctness / 100)
        auto_publish: true
        hide_subgrades: true
    5: &check_off
        type: pass
        subgrades:
            done: boolean
        calculation: done
        hide_calculated: true

grades:
    populations-1:
        <<: *check_off
        deadline: 30/10/26 18:00
    populations-2:
        <<: *manual
        deadline: 9/11/26 18:00
    transformation-1:
        <<: *check_off
        deadline: 18/11/26 18:00
    transformation-2:
        <<: *manual
        deadline: 26/11/26 18:00
    wikipedia:
        <<: *check_off
        deadline: 4/12/26 18:00
    malaria:
        <<: *manual
        deadline: 11/12/26 18:00
    exam: *check_off
    exam2: *check_off

calculation:
    final:
        assignments: 100
        exam: 0
    retake:
        assignments: 100
        exam2: 0

assignments:
    type: average
    show_progress: true
    submits:
        populations-1: 0
        populations-2: 2
        transformation-1: 0
        transformation-2: 2
        wikipedia: 0
        malaria: 2

manualcheck:
    type: points
    submits:
        populations-1: 1
        transformation-1: 1
        wikipedia: 1

exam:
    required: true
    show_progress: true
    submits:
        exam: 1

exam2:
    required: true
    show_progress: true
    submits:
        exam2: 1
